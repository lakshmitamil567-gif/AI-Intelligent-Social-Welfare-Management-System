<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Welfare Management System</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #2196F3;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            text-align: center;
            padding: 50px;
        }

        .card {
            display: inline-block;
            background: white;
            padding: 30px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
            color: #2196F3;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Welfare Management System</h1>
    <p>Dashboard</p>
</header>

<div class="container">

    <h2>System Overview</h2>

    <div class="card">
        <h3>Beneficiaries</h3>
        <div>{{ registrations_count}}</div>
        <p>Registered Beneficiaries</p>
        </div>

    <div class="card">
        <h3>Welfare Schemes</h3>
        <div>{{ schemes_count}} </div>
        <p>Available Schemes</p>
    </div>

    <div class="card">
        <h3>Registrations</h3>
        <div>{{ registrations_count}}</div>
        <p>Total Registrations</p>
    </div>

    <br>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
