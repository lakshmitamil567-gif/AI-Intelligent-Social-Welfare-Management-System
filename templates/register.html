<!DOCTYPE html>
<html>
<head>
    <title>Registration - Welfare Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .header {
            background: #1683e8;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #1683e8;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #1683e8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #086dcc;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Welfare Management System</h1>
        <p>Beneficiary Registration</p>
    </div>

    <div class="container">

        <h2>Register Beneficiary</h2>

        <form action="/register" method="POST">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Age</label>
            <input type="number" name="age" min="1" max="120" required>

            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Phone Number</label>
            <input type="tel" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="Optional">

            <label>Address</label>
            <input type="text" name="address" minlength="5" required>

            <label>Welfare Scheme</label>
            <select name="scheme" required>
                <option value="">Select Scheme</option>
                <option>Education Support</option>
                <option>Health Support</option>
                <option>Food Support</option>
                <option>Financial Assistance</option>
            </select>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
