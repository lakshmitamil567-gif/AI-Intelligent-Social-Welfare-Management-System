<!DOCTYPE html>
<html>
<head>
    <title>Applications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f8fb;
        }

        header {
            background-color: #2196f3;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        h2 {
            color: #2196f3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #2196f3;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2196f3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Welfare Management System</h1>
    <p>Application Details</p>
</header>

<div class="container">

    <h2>Applications List</h2>

    <table>
        <tr>
            <th>Application ID</th>
            <th>Beneficiary ID</th>
            <th>Scheme ID</th>
            <th>Status</th>
        </tr>

        {% for application in applications %}
        <tr>
            <td>{{ application[0] }}</td>
            <td>{{ application[1] }}</td>
            <td>{{ application[2] }}</td>
            <td>{{ application[3] }}</td>
        </tr>
        {% endfor %}

    </table>

    <a href="/" class="back">Back to Home</a>

</div>

</body>
</html>
